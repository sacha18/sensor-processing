# Nginx configuration for host server (outside Docker)
# Place this file in: /etc/nginx/sites-available/sensor-data-processor
# Then: sudo ln -s /etc/nginx/sites-available/sensor-data-processor /etc/nginx/sites-enabled/
# And: sudo nginx -t && sudo systemctl reload nginx

upstream frontend {
    server localhost:5173;  # Development
    # server localhost:80;  # Production (uncomment and comment above)
}

upstream backend {
    server localhost:8000;
}

server {
    listen 80;
    server_name _;  # Replace with your domain/IP if needed

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/sensor-data-processor-access.log;
    error_log /var/log/nginx/sensor-data-processor-error.log;

    # Large file uploads for sensor data
    client_max_body_size 500M;
    client_body_timeout 300s;
    send_timeout 300s;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR (dev mode)
        proxy_read_timeout 86400;
    }

    # Backend API
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running jobs
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API documentation
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        access_log off;
    }
}

