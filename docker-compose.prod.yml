version: '3.8'

services:
  # Redis - for async job queue
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sdp-network

  # FastAPI backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    environment:
      REDIS_URL: redis://redis:6379
      SDP_STORE_DIR: /data/store
      SDP_STORE_TTL_DAYS: ${SDP_STORE_TTL_DAYS:-30}
      PYTHONPATH: /app
    volumes:
      - /data/sensor-data-processor:/data  # Map to host for persistence
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - sdp-network

  # RQ Worker - 1 worker is enough for 5 users
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: rq worker default high low --url redis://redis:6379 --logging_level INFO
    environment:
      REDIS_URL: redis://redis:6379
      SDP_STORE_DIR: /data/store
      PYTHONPATH: /app
    volumes:
      - /data/sensor-data-processor:/data  # Map to host for persistence
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - sdp-network

  # React Frontend (production build with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sdp-network

volumes:
  redis_data:

networks:
  sdp-network:
    driver: bridge
