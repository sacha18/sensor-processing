services:
  sensor-pipeline:
    build: .
    ports:
      - "8501:8501"
    # Works out of the box with the bundled sample_data/ - no volume needed.
    # To use your own dataset, uncomment below and point at any folder of
    # <sensor_id>.json / <sensor_id>.csv observation files:
    # volumes:
    #   - /path/to/your/dataset:/data:ro
